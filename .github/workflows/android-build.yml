set -e

# Repository check
if [ ! -d ".git" ]; then
  echo "ERROR: GitHub repository folder mein nahi hain."
  exit 1
fi

# ZIP check
ZIP="SocialMediaPublisherPRO_WITH_APP_ICON.zip"

if [ ! -f "$ZIP" ]; then
  echo "ERROR: Updated ZIP pehle repository mein upload karein."
  exit 1
fi

# Extract updated project
mkdir -p /tmp/socialpublisher_update
unzip -oq "$ZIP" -d /tmp/socialpublisher_update

SRC="/tmp/socialpublisher_update/SocialMediaPublisherPRO"

if [ ! -d "$SRC/app" ]; then
  echo "ERROR: Android source files nahi mile."
  exit 1
fi

# Copy project files without replacing Git metadata
cp -a "$SRC/." .

# Check launcher icon
test -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
test -f app/src/main/AndroidManifest.xml

# Git configuration
git config user.name "SocialMediaPublisherPRO"
git config user.email "actions@users.noreply.github.com"

# Commit and push
git add .
git commit -m "Add complete Android source and professional app icon" || {
  echo "No new changes to commit."
}

git push origin main

echo "SUCCESS: Project uploaded to GitHub."
echo "Now open Actions and run Android Build."
