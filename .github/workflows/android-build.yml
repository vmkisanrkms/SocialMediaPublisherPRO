name: Social Media Publisher PRO Android Build

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Show Repository Structure
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -name settings.gradle.kts

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK 36
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Project Files
        working-directory: SocialMediaPublisherPRO
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/socialpublisher/pro/MainActivity.kt
          echo "All project files verified."

      - name: Build Debug APK
        working-directory: SocialMediaPublisherPRO
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          test -s SocialMediaPublisherPRO/app/build/outputs/apk/debug/app-debug.apk
          ls -lh SocialMediaPublisherPRO/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SocialMediaPublisherPRO-APK
          path: SocialMediaPublisherPRO/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
